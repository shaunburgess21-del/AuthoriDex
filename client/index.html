<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VoxDex | Vox Populi - Indexed</title>
    <meta name="description" content="VoxDex turns the voice of the people into a living, real-time index. Vote, predict, and weigh in on the figures and topics shaping global conversation. — make your voice heard, one vote at a time." />
    <link rel="icon" type="image/svg+xml" href="/voxdex-favicon.svg" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      Open Graph + Twitter card fallback for the homepage and list pages.
      Matchup, opinion, sentiment, predict, celebrity, and other shareable
      detail URLs get their own title, description, canonical, image, and
      JSON-LD injected into this shell by middleware.ts before the response
      leaves Vercel, so the first HTML byte (no JS required) is unique per
      page. useDocumentMeta keeps the tab in sync after hydration. The
      UA-matched Railway rewrite in vercel.json remains the fallback.
    -->
    <link rel="canonical" href="https://voxdex.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VoxDex" />
    <meta property="og:title" content="VoxDex | Vox Populi - Indexed" />
    <meta property="og:description" content="VoxDex turns the voice of the people into a living, real-time index. Vote, predict, and weigh in on the figures and topics shaping global conversation. — make your voice heard, one vote at a time." />
    <meta property="og:url" content="https://voxdex.com/" />
    <meta property="og:image" content="https://voxdex.com/og/og-default.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@voxdex" />
    <meta name="twitter:title" content="VoxDex | Vox Populi - Indexed" />
    <meta name="twitter:description" content="VoxDex turns the voice of the people into a living, real-time index. Vote, predict, and weigh in on the figures and topics shaping global conversation. — make your voice heard, one vote at a time." />
    <meta name="twitter:image" content="https://voxdex.com/og/og-default.png?v=2" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/voxdex-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Load Google Fonts without blocking first paint: fetch the stylesheet as a
      preload, then promote it to a real stylesheet once it arrives. `display=swap`
      keeps text visible in a fallback face until the web font loads. <noscript>
      covers the no-JS / crawler path.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
