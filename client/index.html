<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VoxDex | Vox Populi - Indexed</title>
    <meta name="description" content="VoxDex turns the voice of the people into a living, real-time index. Vote, predict, and weigh in on the figures and topics shaping global conversation. — make your voice heard, one vote at a time." />
    <link rel="icon" type="image/svg+xml" href="/voxdex-favicon.svg" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      Open Graph + Twitter card fallback for the homepage and list pages.
      Matchup, opinion, sentiment, predict, celebrity, and other shareable
      detail URLs get their own title, description, canonical, image, and
      JSON-LD injected into this shell by middleware.ts before the response
      leaves Vercel, so the first HTML byte (no JS required) is unique per
      page. useDocumentMeta keeps the tab in sync after hydration. The
      UA-matched Railway rewrite in vercel.json remains the fallback.
    -->
    <link rel="canonical" href="https://voxdex.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VoxDex" />
    <meta property="og:title" content="VoxDex | Vox Populi - Indexed" />
    <meta property="og:description" content="VoxDex turns the voice of the people into a living, real-time index. Vote, predict, and weigh in on the figures and topics shaping global conversation. — make your voice heard, one vote at a time." />
    <meta property="og:url" content="https://voxdex.com/" />
    <meta property="og:image" content="https://voxdex.com/og/og-default.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@voxdex" />
    <meta name="twitter:title" content="VoxDex | Vox Populi - Indexed" />
    <meta name="twitter:description" content="VoxDex turns the voice of the people into a living, real-time index. Vote, predict, and weigh in on the figures and topics shaping global conversation. — make your voice heard, one vote at a time." />
    <meta name="twitter:image" content="https://voxdex.com/og/og-default.png?v=2" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/voxdex-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Load Google Fonts without blocking first paint: fetch the stylesheet as a
      preload, then promote it to a real stylesheet once it arrives. `display=swap`
      keeps text visible in a fallback face until the web font loads. <noscript>
      covers the no-JS / crawler path.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <!--
      Static first paint, replaced when React mounts into #root.
      CSS only: no images, no extra requests. Colors match the theme
      tokens (light, and .dark set by the head script before body).
      Header is the app nav's 64px bar so the handoff does not jump.
    -->
    <style>
      html,body{margin:0;background:hsl(0 0% 98%)}
      html.dark,html.dark body{background:hsl(220 31% 6%)}
      #boot-shell{min-height:100vh;background:hsl(0 0% 98%);color:hsl(220 20% 10%)}
      html.dark #boot-shell{background:hsl(220 31% 6%);color:hsl(220 10% 98%)}
      .boot-header{position:sticky;top:0;z-index:50;box-sizing:border-box;height:65px;border-bottom:1px solid hsl(220 12% 88%);background:hsl(0 0% 98%)}
      html.dark .boot-header{border-bottom-color:hsl(220 12% 20%);background:hsl(220 31% 6%)}
      .boot-header-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:80rem;margin:0 auto;padding:0 16px;gap:12px}
      .boot-brand{display:flex;align-items:center;gap:8px}
      .boot-nav{display:none}
      .boot-main{max-width:48rem;margin:0 auto;padding:24px 16px 96px}
      .boot-bar{display:block;border-radius:6px;background:hsl(220 12% 88%)}
      html.dark .boot-bar{background:hsl(220 14% 18%)}
      .boot-logo{width:32px;height:32px;border-radius:8px}
      .boot-word{width:92px;height:20px}
      .boot-menu{width:36px;height:36px;border-radius:999px}
      .boot-line{height:32px;width:42%;margin-bottom:16px}
      .boot-card{height:192px;width:100%;margin-bottom:16px;border-radius:12px}
      .boot-card-tall{height:256px}
      .boot-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      @media (min-width:768px){
        .boot-header-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
        .boot-nav{display:flex;justify-content:center;gap:18px}
        .boot-nav-item{width:64px;height:14px}
        .boot-menu{justify-self:end}
      }
      @media (prefers-reduced-motion:no-preference){
        .boot-bar{animation:boot-pulse 1.6s ease-in-out infinite}
      }
      @keyframes boot-pulse{50%{opacity:.55}}
    </style>
    <div id="root">
      <div id="boot-shell" aria-busy="true">
        <span class="boot-sr">Loading</span>
        <header class="boot-header">
          <div class="boot-header-inner">
            <div class="boot-brand">
              <span class="boot-bar boot-logo"></span>
              <span class="boot-bar boot-word"></span>
            </div>
            <div class="boot-nav" aria-hidden="true">
              <span class="boot-bar boot-nav-item"></span>
              <span class="boot-bar boot-nav-item"></span>
              <span class="boot-bar boot-nav-item"></span>
              <span class="boot-bar boot-nav-item"></span>
              <span class="boot-bar boot-nav-item"></span>
            </div>
            <span class="boot-bar boot-menu"></span>
          </div>
        </header>
        <main class="boot-main">
          <span class="boot-bar boot-line"></span>
          <span class="boot-bar boot-card"></span>
          <span class="boot-bar boot-card boot-card-tall"></span>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
